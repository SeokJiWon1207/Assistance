<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서버 점검중입니다</title>
    <style>
      /* nginx가 앱과 무관하게 직접 내려주는 페이지라 외부 파일을 참조하지 않는다.
         앱이 완전히 내려가 있어도 이 화면은 그대로 보여야 한다. */
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", "Segoe UI", sans-serif;
        background: #0f1218;
        color: #e8ecf3;
      }
      .card {
        width: 100%;
        max-width: 460px;
        padding: 40px 32px;
        border-radius: 18px;
        text-align: center;
        background: #171c25;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.36);
      }
      .icon {
        font-size: 44px;
        line-height: 1;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 700;
        word-break: keep-all;
      }
      p {
        margin: 6px 0 0;
        font-size: 15px;
        line-height: 1.6;
        opacity: 0.78;
        word-break: keep-all;
      }
      .brand {
        margin-top: 28px;
        font-size: 13px;
        opacity: 0.5;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f4f6fa;
          color: #1b1f27;
        }
        .card {
          background: #fff;
          box-shadow: 0 20px 48px rgba(15, 18, 24, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">🛠️</div>
      <h1>서버 점검중입니다.</h1>
      <p>점검이 끝나면 다시 이용하실 수 있습니다.</p>
      <p>잠시 후 새로고침해 주세요.</p>
      <p>문의사항은 석지원 대리에게 문의해주세요.</p>
      <p class="brand">컨텐츠서비스 AI 비서</p>
    </main>
  </body>
</html>
