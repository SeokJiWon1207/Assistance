[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["assistant_web/.venv", "data", "ObsidianNotes"]

[tool.ruff.lint]
select = ["F", "B"]

[tool.mypy]
python_version = "3.12"
files = ["assistant_web/backend"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = "assistant_web/.venv|data|ObsidianNotes"
