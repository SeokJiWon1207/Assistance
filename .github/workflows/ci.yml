name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 코드 변경이 없어도 보안 예외 만료와 새 취약점을 매주 확인한다.
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant_web/requirements-dev.lock

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r assistant_web/requirements-dev.lock

      # 검증 명령의 단일 기준은 assistant_web/scripts/check.sh이며 단계별로 나눠 로그를 남긴다.
      - name: Run deterministic test suite
        run: bash assistant_web/scripts/check.sh tests

      - name: Compile Python sources
        run: bash assistant_web/scripts/check.sh compile

      - name: Validate deployment shell scripts
        run: bash assistant_web/scripts/check.sh shell

      - name: Ruff
        run: bash assistant_web/scripts/check.sh ruff

      - name: mypy
        run: bash assistant_web/scripts/check.sh mypy

      - name: Dependency audit
        run: bash assistant_web/scripts/check.sh audit
