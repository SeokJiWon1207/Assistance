name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 코드 변경이 없어도 보안 예외 만료와 새 취약점을 매주 확인한다.
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant_web/requirements-dev.lock

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r assistant_web/requirements-dev.lock

      - name: Run deterministic test suite
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: coverage run assistant_web/tests/run_test_suite.py

      - name: Report coverage
        run: coverage report

      - name: Compile Python sources
        run: python -m compileall -q assistant_web/backend assistant_web/scripts assistant_web/tests

      - name: Validate deployment shell scripts
        run: |
          bash -n assistant_web/scripts/commands/*.command
          bash -n assistant_web/deploy/aws/deploy_to_ec2.sh
          bash -n assistant_web/deploy/aws/setup_server.sh
          bash -n assistant_web/deploy/aws/rollback_release.sh

      - name: Ruff
        run: ruff check assistant_web/backend assistant_web/tests scripts

      - name: mypy
        run: mypy

      - name: Dependency audit
        run: python assistant_web/scripts/check_dependency_audit.py
